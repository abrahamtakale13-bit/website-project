<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <title>JS Tool | Abraham</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #eef2f3; }
        nav { background: #333; padding: 15px; }
        nav a { color: white; margin: 0 15px; text-decoration: none; }
        .tool-box { background: white; padding: 30px; border-radius: 10px; display: inline-block; margin-top: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { padding: 10px; width: 200px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #resultArea { margin-top: 20px; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="skills.html">Skills</a>
        <a href="tool.html">JS Tool</a>
        <a href="contact.html">Contact</a>
    </nav>
    <div class="tool-box">
        <h2>JavaScript Interactive Tool</h2>
        <p>Maaloo maqaa kee galchi:</p>
        <input type="text" id="visitorName" placeholder="Maqaa kee asitti barreessi...">
        <button onclick="checkStatus()">Check Progress</button>
        <p id="resultArea"></p>
    </div>

    <script>
        function checkStatus() {
            let name = document.getElementById('visitorName').value;
            let res = document.getElementById('resultArea');
            if(name === "") {
                alert("Maaloo maqaa galchi!");
            } else {
                res.innerText = "Nagaa " + name + "! Pirojektiin kee 100% fudhatameera. JavaScript sirriitti hojjechaa jira!";
                res.style.color = "green";
            }
        }
    </script>
</body>
</html>
